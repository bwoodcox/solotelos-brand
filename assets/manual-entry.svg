  <!-- edited row highlight -->
  <rect x="40" y="162" width="560" height="28" rx="6" fill="#5B8DB8" fill-opacity="0.09" stroke="#5B8DB8" stroke-opacity="0.5"/>
  <rect x="40" y="162" width="2.5" height="28" rx="1.2" fill="#5B8DB8"/>

  <!-- ── In-place editor callout ── -->
  <g filter="url(#popShadow)">
    <rect x="160" y="196" width="436" height="172" rx="12" fill="#181818" stroke="#40658a"/>
  </g>
  <!-- pointer to the edited row -->
  <path d="M236 197 L248 187 L260 197 Z" fill="#181818"/>
  <path d="M236 197 L248 187 L260 197" stroke="#40658a" stroke-width="1" fill="none" stroke-linejoin="round"/>

  <!-- callout header -->
  <text x="180" y="224" font-size="12" fill="#ffffff" font-weight="600">Edit trade</text>
  <text x="248" y="224" font-size="11" fill="#666">· TSLA · Jul 10</text>
  <rect x="486" y="211" width="90" height="18" rx="9" fill="#16283a"/>
  <text x="531" y="224" font-size="9" fill="#5B8DB8" text-anchor="middle" letter-spacing="0.6">MANUAL</text>

  <!-- field row 1 -->
  <g font-size="8" letter-spacing="1.2" fill="#555">
    <text x="180" y="246">SYMBOL</text>
    <text x="282" y="246">SIDE</text>
    <text x="384" y="246">QTY</text>
    <text x="486" y="246">ENTRY</text>
  </g>
  <g font-size="11">
    <rect x="180" y="252" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="190" y="268" fill="#ddd">TSLA</text>

    <rect x="282" y="252" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="292" y="268" fill="#c25050">Short</text>
    <path d="M356 262 l4 4 4-4" stroke="#666" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="384" y="252" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="394" y="268" fill="#ddd">50</text>

    <rect x="486" y="252" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="496" y="268" fill="#ddd">242.10</text>
  </g>

  <!-- field row 2 -->
  <g font-size="8" letter-spacing="1.2" fill="#555">
    <text x="180" y="296">EXIT</text>
    <text x="282" y="296">FEES</text>
    <text x="384" y="296">SETUP</text>
    <text x="486" y="296">BROKER</text>
  </g>
  <g font-size="11">
    <!-- focused field -->
    <rect x="180" y="302" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#5B8DB8" stroke-width="1.4"/>
    <text x="190" y="318" fill="#ffffff">236.80</text>
    <rect x="234" y="308" width="1.4" height="12" fill="#5B8DB8"/>

    <rect x="282" y="302" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="292" y="318" fill="#ddd">1.30</text>

    <rect x="384" y="302" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="394" y="318" fill="#5B8DB8">Reversal</text>
    <path d="M458 312 l4 4 4-4" stroke="#666" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="486" y="302" width="90" height="24" rx="6" fill="#0D0D0D" stroke="#2b2b2b"/>
    <text x="496" y="318" fill="#999" font-size="10">Manual</text>
    <path d="M560 312 l4 4 4-4" stroke="#666" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- actions -->
  <text x="180" y="353" font-size="9" fill="#555">Edits are logged · original import kept</text>
  <rect x="396" y="336" width="80" height="26" rx="7" fill="none" stroke="#333"/>
  <text x="436" y="353" font-size="10" fill="#999" text-anchor="middle">Cancel</text>
  <rect x="488" y="336" width="88" height="26" rx="7" fill="#5B8DB8"/>
  <text x="532" y="353" font-size="10" fill="#0A0A0A" text-anchor="middle" font-weight="600">Save trade</text>
</svg>
