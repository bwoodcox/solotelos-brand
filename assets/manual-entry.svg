<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Montserrat, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="popShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="640" height="400" rx="14" fill="#141414"/>
  <rect x="0.5" y="0.5" width="639" height="399" rx="13.5" stroke="#242424"/>

  <!-- ── Header ── -->
  <text x="32" y="46" font-size="20" fill="#ffffff" font-weight="600">Trades</text>
  <text x="32" y="66" font-size="10" fill="#555">July 2026 · 46 imported · 3 added by hand</text>
  <rect x="494" y="30" width="114" height="28" rx="14" fill="#5B8DB8"/>
  <text x="551" y="48" font-size="11" fill="#0A0A0A" text-anchor="middle" font-weight="600">+ Add trade</text>

  <!-- ── Spreadsheet card ── -->
  <rect x="32" y="86" width="576" height="284" rx="10" fill="#0D0D0D" stroke="#1e1e1e"/>

  <!-- column headers -->
  <g font-size="9" letter-spacing="1.2" fill="#484848">
    <text x="48" y="110">DATE</text>
    <text x="108" y="110">SYMBOL</text>
    <text x="172" y="110">SIDE</text>
    <text x="226" y="110">QTY</text>
    <text x="272" y="110">ENTRY</text>
    <text x="336" y="110">EXIT</text>
    <text x="400" y="110">P&amp;L</text>
    <text x="478" y="110">SOURCE</text>
  </g>
  <line x1="40" y1="122" x2="600" y2="122" stroke="#1e1e1e"/>

  <!-- ── Grid rows (lower ones sit beneath the editor) ── -->
  <g font-size="11">
    <!-- row 1 -->
    <text x="48" y="146" fill="#666">Jul 12</text>
    <text x="108" y="146" fill="#fff" font-weight="600">NVDA</text>
    <text x="172" y="146" fill="#3fa876">Long</text>
    <text x="226" y="146" fill="#999">40</text>
    <text x="272" y="146" fill="#999">132.40</text>
    <text x="336" y="146" fill="#999">138.65</text>
    <text x="400" y="146" fill="#3fa876">+$1,240</text>
    <rect x="478" y="132" width="104" height="20" rx="10" fill="#1C1C1C"/>
    <text x="530" y="146" font-size="10" fill="#777" text-anchor="middle">Schwab</text>
    <line x1="40" y1="160" x2="600" y2="160" stroke="#1a1a1a"/>

    <!-- row 2 — being edited -->
    <text x="48" y="176" fill="#8a8a8a">Jul 10</text>
    <text x="108" y="176" fill="#fff" font-weight="600">TSLA</text>
    <text x="172" y="176" fill="#c25050">Short</text>
    <text x="226" y="176" fill="#bbb">50</text>
    <text x="272" y="176" fill="#bbb">242.10</text>
    <text x="336" y="176" fill="#bbb">236.80</text>
    <text x="400" y="176" fill="#3fa876">+$265</text>
    <rect x="478" y="162" width="104" height="20" rx="10" fill="#16283a"/>
    <text x="530" y="176" font-size="10" fill="#5B8DB8" text-anchor="middle">Manual</text>

    <!-- rows beneath -->
    <text x="48" y="206" fill="#5a5a5a">Jul 09</text>
    <text x="108" y="206" fill="#cfcfcf" font-weight="600">MSFT</text>
    <text x="172" y="206" fill="#c25050">Short</text>
    <text x="226" y="206" fill="#777">25</text>
    <text x="272" y="206" fill="#777">502.30</text>
    <text x="336" y="206" fill="#777">495.10</text>
    <text x="400" y="206" fill="#3fa876">+$720</text>
    <rect x="478" y="192" width="104" height="20" rx="10" fill="#1C1C1C"/>
    <text x="530" y="206" font-size="10" fill="#777" text-anchor="middle">E*TRADE</text>
    <line x1="40" y1="220" x2="600" y2="220" stroke="#1a1a1a"/>

    <text x="48" y="236" fill="#5a5a5a">Jul 08</text>
    <text x="108" y="236" fill="#cfcfcf" font-weight="600">AMD</text>
    <text x="172" y="236" fill="#3fa876">Long</text>
    <text x="226" y="236" fill="#777">80</text>
    <text x="272" y="236" fill="#777">168.40</text>
    <text x="336" y="236" fill="#777">172.90</text>
    <text x="400" y="236" fill="#3fa876">+$980</text>
    <rect x="478" y="222" width="104" height="20" rx="10" fill="#1C1C1C"/>
    <text x="530" y="236" font-size="10" fill="#777" text-anchor="middle">Schwab</text>
    <line x1="40" y1="250" x2="600" y2="250" stroke="#1a1a1a"/>

    <text x="48" y="266" fill="#5a5a5a">Jul 07</text>
    <text x="108" y="266" fill="#cfcfcf" font-weight="600">META</text>
    <text x="172" y="266" fill="#3fa876">Long</text>
    <text x="226" y="266" fill="#777">30</text>
    <text x="272" y="266" fill="#777">704.10</text>
    <text x="336" y="266" fill="#777">698.20</text>
    <text x="400" y="266" fill="#c25050">−$177</text>
    <rect x="478" y="252" width="104" height="20" rx="10" fill="#1C1C1C"/>
    <text x="530" y="266" font-size="10" fill="#777" text-anchor="middle">Fidelity</text>
    <line x1="40" y1="280" x2="600" y2="280" stroke="#1a1a1a"/>

    <text x="48" y="296" fill="#5a5a5a">Jul 03</text>
    <text x="108" y="296" fill="#cfcfcf" font-weight="600">GOOG</text>
    <text x="172" y="296" fill="#3fa876">Long</text>
    <text x="226" y="296" fill="#777">45</text>
    <text x="272" y="296" fill="#777">182.60</text>
    <text x="336" y="296" fill="#777">188.40</text>
    <text x="400" y="296" fill="#3fa876">+$261</text>
    <rect x="478" y="282" width="104" height="20" rx="10" fill="#1C1C1C"/>
    <text x="530" y="296" font-size="10" fill="#777" text-anchor="middle">Schwab</text>
    <line x1="40" y1="310" x2="600" y2="310" stroke="#1a1a1a"/>

    <text x="48" y="326" fill="#5a5a5a">Jul 02</text>
    <text x="108" y="326" fill="#cfcfcf" font-weight="600">AMZN</text>
    <text x="172" y="326" fill="#c25050">Short</text>
    <text x="226" y="326" fill="#777">35</text>
    <text x="272" y="326" fill="#777">214.80</text>
    <text x="336" y="326" fill="#777">210.20</text>
    <text x="400" y="326" fill="#3fa876">+$161</text>
