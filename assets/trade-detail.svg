  </g>

  <!-- Journal note -->
  <rect x="32" y="298" width="576" height="72" rx="10" fill="#0D0D0D" stroke="#1e1e1e"/>
  <text x="48" y="320" font-size="8" letter-spacing="1.5" fill="#555">JOURNAL NOTE</text>
  <text x="48" y="340" font-size="11" fill="#999">Waited for the retest of the breakout level instead of chasing. Entry was clean,</text>
  <text x="48" y="356" font-size="11" fill="#999">sized to plan. Lesson: the setup works when I let it come to me.</text>
  <line x1="40" y1="306" x2="40" y2="362" stroke="#5B8DB8" stroke-width="2"/>
