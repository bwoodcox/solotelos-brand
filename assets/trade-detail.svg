    <line x1="144" y1="194" x2="144" y2="232" stroke="#c25050" stroke-width="1.4"/><rect x="138" y="200" width="12" height="22" fill="#c25050" rx="1"/>
    <line x1="170" y1="176" x2="170" y2="222" stroke="#3fa876" stroke-width="1.4"/><rect x="164" y="184" width="12" height="28" fill="#3fa876" rx="1"/>
    <line x1="196" y1="160" x2="196" y2="204" stroke="#3fa876" stroke-width="1.4"/><rect x="190" y="168" width="12" height="26" fill="#3fa876" rx="1"/>
    <line x1="222" y1="166" x2="222" y2="200" stroke="#c25050" stroke-width="1.4"/><rect x="216" y="172" width="12" height="18" fill="#c25050" rx="1"/>
    <line x1="248" y1="148" x2="248" y2="192" stroke="#3fa876" stroke-width="1.4"/><rect x="242" y="156" width="12" height="26" fill="#3fa876" rx="1"/>
    <line x1="274" y1="132" x2="274" y2="176" stroke="#3fa876" stroke-width="1.4"/><rect x="268" y="140" width="12" height="26" fill="#3fa876" rx="1"/>
    <line x1="300" y1="126" x2="300" y2="162" stroke="#3fa876" stroke-width="1.4"/><rect x="294" y="132" width="12" height="22" fill="#3fa876" rx="1"/>
    <line x1="326" y1="118" x2="326" y2="152" stroke="#5B8DB8" stroke-width="1.4"/><rect x="320" y="124" width="12" height="20" fill="none" stroke="#5B8DB8" stroke-width="1.8" rx="1"/>
    <line x1="352" y1="108" x2="352" y2="140" stroke="#3fa876" stroke-width="1.4"/><rect x="346" y="114" width="12" height="18" fill="#3fa876" rx="1"/>
  </g>
  <!-- entry/exit markers -->
  <g font-size="9">
    <line x1="48" y1="214" x2="376" y2="214" stroke="#3fa876" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="372" y="210" fill="#3fa876" text-anchor="end">Entry 132.40 ▲</text>
    <line x1="48" y1="120" x2="376" y2="120" stroke="#5B8DB8" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="372" y="116" fill="#5B8DB8" text-anchor="end">Exit 138.65 ●</text>
  </g>

  <!-- Right column: R stats -->
  <g>
    <rect x="412" y="86" width="196" height="58" rx="10" fill="#0D0D0D" stroke="#1e1e1e"/>
    <text x="428" y="108" font-size="8" letter-spacing="1.5" fill="#555">RESULT</text>
    <text x="428" y="132" font-size="18" fill="#3fa876" font-weight="400">+2.1R</text>
    <text x="530" y="132" font-size="10" fill="#555">Risk $590</text>

    <rect x="412" y="154" width="196" height="58" rx="10" fill="#0D0D0D" stroke="#1e1e1e"/>
    <text x="428" y="176" font-size="8" letter-spacing="1.5" fill="#555">PLAN ADHERENCE</text>
    <text x="428" y="200" font-size="18" fill="#5B8DB8" font-weight="400">92%</text>
    <text x="530" y="200" font-size="10" fill="#555">Rules kept</text>

    <rect x="412" y="222" width="196" height="60" rx="10" fill="#0D0D0D" stroke="#1e1e1e"/>
